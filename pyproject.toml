[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "findbuch"
version = "0.0.0"
description = "A verified catalogue of the known integrable cases of rigid body dynamics"
readme = "README.md"
requires-python = ">=3.11"

# The runtime floor, as lower bounds. These say what the project claims to work
# with. They are not what any run measured; requirements.lock is that, and the
# two are kept apart on purpose. The build against the floor is #52.
#
# requirements.lock is regenerated from the bounds below with
#
#     pip-compile --generate-hashes --strip-extras --no-header \
#         --output-file=requirements.lock pyproject.toml
#
# and it carries no generated header, because pip-compile's header repeats the
# interpreter version and .python-version is meant to be the only place that
# number is written. pip-tools 7.6.0 needs pip<26 to run at all; against pip
# 26.1.2 it fails importing stdlib_pkgs before it reads any argument.
#
# The stack is the one docs/decisions/0001-means.md chose: SymPy decides the
# symbolic leg, mpmath carries the arbitrary precision the numeric leg needs.
# NumPy is named in that record as a fast path only and never in the path that
# decides a verdict, so nothing depends on it yet and it is absent here rather
# than declared unused.
dependencies = [
    "sympy>=1.13",
    "mpmath>=1.3",
    "jsonschema>=4.23",
]

# No license field and no authors field. Both are open questions in #1: the
# license of the code and of the rows is entry 1, and the identity a published
# package carries is entry 7. Declaring either here would answer a question
# that is not this issue's to answer.

# The gate's own tools, locked in requirements-dev.lock the same way the runtime
# set is locked in requirements.lock. Regenerate with
#
#     pip-compile --generate-hashes --strip-extras --no-header --extra gate \
#         --output-file=requirements-dev.lock pyproject.toml
[project.optional-dependencies]
gate = [
    "pytest>=8.4",
    "ruff>=0.16",
    "mypy>=1.15",
    "toml-sort>=0.24",
    "coverage>=7.15",
    # Third-party stubs are pinned like any other dependency, which is why they
    # are here and in requirements-dev.lock rather than installed by
    # `mypy --install-types` on whichever machine happens to run the gate.
    "types-jsonschema>=4.23",
]

# The vulnerability scanner, locked the same way and kept in its own set on
# purpose. It is installed into an environment of its own and reads the two
# lockfiles by path rather than reading an environment, so its own dependencies
# never join the set being scanned and a finding is always about something this
# project ships. Regenerate with
#
#     pip-compile --generate-hashes --strip-extras --no-header --extra scan \
#         --output-file=requirements-scan.lock pyproject.toml
scan = [
    "pip-audit>=2.9",
]

# The build and bill-of-materials set, in its own set for the same reason the
# scanner is in its own: it is installed into an environment of its own, it is
# never part of what this project ships, and nothing it drags in behind itself
# joins the runtime set. Regenerate with
#
#     pip-compile --generate-hashes --strip-extras --no-header --allow-unsafe \
#         --extra package --output-file=requirements-package.lock pyproject.toml
#
# `--allow-unsafe` appears here and in none of the other three commands, and it
# is what pins setuptools. Without it pip-compile leaves the build backend out
# of the file and says so in a warning that a regenerated lock does not carry,
# so the flag is written down rather than remembered.
#
# `build` is the PyPA front end for the backend already declared at the top of
# this file, so the artefact a job produces is built through the same hooks a
# consumer's `pip install .` would call rather than through a second procedure.
# `cyclonedx-bom` writes the bill of materials and carries the CycloneDX schemas
# with it, which is what lets tools/package.py validate the document it just
# wrote without this repository holding a copy of somebody else's schema.
#
# `setuptools` is here as well as in `[build-system] requires`, and the
# duplication is the point. `build` in its default mode makes an isolated
# environment and resolves the backend from the index unpinned, so the one step
# that turns this tree into an artefact would be the one step in the whole
# project that installs something nothing hashed. tools/package.py passes
# `--no-isolation` and the backend comes from the lockfile below instead.
package = [
    "build>=1.3",
    "cyclonedx-bom>=7.1",
    "setuptools>=77",
]

[tool.setuptools.packages.find]
where = ["src"]

# The two directories the package reads and that are not Python: the row schema
# and the Poisson structure files. They sit under `src/findbuch/data/` and are
# listed here because setuptools puts nothing but modules in a wheel unless it is
# told to. #84 is where the absence was measured: the wheel imported and then
# could not read either, the schema raising FileNotFoundError and the structure
# registry returning empty, under which every row is refused as
# `structure.unknown` for a fault in the package rather than in the row.
#
# The patterns are written per directory rather than as `data/**/*`, so a file
# type that is added under `data/` later joins the wheel by being named here and
# not by matching a glob nobody re-read. `family/` is its own line for the same
# reason it is its own directory in findbuch.structures.
[tool.setuptools.package-data]
findbuch = [
    "data/schema/*.json",
    "data/structures/*.toml",
    "data/structures/family/*.toml",
]

# The test runner, chosen in #15. The half of its configuration that pytest
# reads from a file is here; the half it reads only from the environment is in
# tools/run_tests.py, which is what every caller of the suite execs.
#
# --strict-config and --strict-markers, because a typo in this table or in a
# marker name is otherwise a silent no-op, and a runner that ignores what it
# does not understand is a runner that can be configured into doing nothing.
#
# -p no:cacheprovider, because the cache is state written into the checkout
# between runs and read by the next one, and a suite whose result depends on
# what the last run left behind is not reproducible from a clean checkout.
#
# --import-mode=importlib, so that the modules under tests/ are imported as
# themselves rather than through sys.path insertion. The package under test is
# the installed one either way, which is what tests/test_package_tree.py
# asserts.
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-config --strict-markers -p no:cacheprovider --import-mode=importlib"
xfail_strict = true

# Lint and format. Both run in check mode wherever the gate calls them; neither
# has a fixing mode configured here, because a gate that rewrites the tree
# leaves a green log and a dirty working copy and the difference between those
# two is invisible afterwards.
[tool.ruff]
line-length = 88
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "A",    # shadowing a builtin
    "ARG",  # an argument nothing reads
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "PTH",  # os.path where pathlib is meant
    "RUF",  # ruff's own
    "SIM",  # simplifiable constructs
    "TID",  # tidy imports
    "UP",   # constructs the floor makes obsolete
    "W",    # pycodestyle warnings
]

# Types. strict, and over a module set written out rather than discovered, so a
# module joins the checked set by being added to this list. Nothing infers it,
# which is the point: tests/test_type_check_coverage.py refuses a tracked module
# that is missing from it, so the list cannot fall behind the tree in silence.
[tool.mypy]
strict = true
files = [
    "src/findbuch/__init__.py",
    "tests/test_package_tree.py",
    "tests/test_gate.py",
    "tests/test_row_schema.py",
    "tests/test_type_check_coverage.py",
    "src/findbuch/validation.py",
    "src/findbuch/invariants.py",
    "tests/test_invariants.py",
    "tools/check_invariants.py",
    "tools/check_catalogue_format.py",
    "tools/check_catalogue_schema.py",
    "tools/check_interpreter.py",
    "tools/gate.py",
    "tools/floor.py",
    "tests/test_floor.py",
    "tools/coverage_bar.py",
    "tests/test_coverage_bar.py",
    "tools/run_tests.py",
    "tests/test_refusal_shape.py",
    "tools/verify_symbolic_fast.py",
    "tools/verify_numeric_fast.py",
    "tests/test_check_names.py",
    "tests/test_verification_legs.py",
    ".github/isolation/probe.py",
    "src/findbuch/expression.py",
    "tests/test_expression_grammar.py",
    "src/findbuch/structures.py",
    "tests/test_structures.py",
    "tests/test_refused_corpus.py",
    "tests/test_expression_bounds.py",
    "src/findbuch/fuzz.py",
    "tools/fuzz_parser.py",
    "tests/test_fuzz_harness.py",
    "src/findbuch/integrator.py",
    "tools/casimir_drift.py",
    "tests/test_integrator.py",
    "tools/supply_chain.py",
    "tests/test_supply_chain.py",
    "tools/package.py",
    "tests/test_package.py",
    "tools/mutation_sample.py",
    "tests/test_mutation_sample.py",
    "tests/test_mutation_survivors.py",
    "tests/test_package_data.py",
]

# SymPy ships no type information and no stub package is published for it, so
# the checker cannot see through the import. The alternative to this override is
# `Any` spreading out of every call, which strict mode would then not report.
# Scoped to the one distribution rather than switched on globally.
[[tool.mypy.overrides]]
module = ["sympy.*"]
ignore_missing_imports = true

# mpmath ships no type information either, and it is the arbitrary precision
# arithmetic the numeric leg is built on rather than an incidental import. The
# cost is stated where the override is: every value crossing that boundary is
# Any to the checker, so `Number` in src/findbuch/integrator.py names it rather
# than leaving the reader to work out which of the annotations mean anything.
[[tool.mypy.overrides]]
module = ["mpmath.*"]
ignore_missing_imports = true

# cyclonedx-python-lib is in the `package` set and in neither the runtime set nor
# the gate set, so the environment that runs the type checker does not have it
# installed and the checker cannot see the import. The alternative is putting a
# build tool into every run of the suite to satisfy a checker, which costs every
# contributor a longer install for two lines of one tool. The two names behind
# this override are used in one function, `validate_sbom` in tools/package.py,
# so what `Any` costs is bounded by that function, and what the function decides
# is proven by the fixture pair its self-test runs rather than by the checker.
[[tool.mypy.overrides]]
module = ["cyclonedx.*"]
ignore_missing_imports = true

# Coverage. Branch coverage, over what this project ships and not over the suite
# that exercises it: a number that counted the tests would rise when a test was
# added and say nothing about the code. Which modules are gated on the number and
# which are only reported is tools/coverage_bar.py, with the reason at each one,
# and #54 is where that split was argued.
[tool.coverage.run]
branch = true
source = ["src", "tools"]

[tool.coverage.report]
show_missing = true

# Row formatting. --no-sort-tables, because the field order in a row is fixed by
# docs/decisions/0003-row-format.md and reordering it would make two rows harder
# to compare rather than easier, which is the whole reason the rows are formatted
# at all.
[tool.tomlsort]
no_sort_tables = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
