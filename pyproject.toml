[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "findbuch"
version = "0.0.0"
description = "A verified catalogue of the known integrable cases of rigid body dynamics"
readme = "README.md"
requires-python = ">=3.11"

# The runtime floor, as lower bounds. These say what the project claims to work
# with. They are not what any run measured; requirements.lock is that, and the
# two are kept apart on purpose. The build against the floor is #52.
#
# requirements.lock is regenerated from the bounds below with
#
#     pip-compile --generate-hashes --strip-extras --no-header \
#         --output-file=requirements.lock pyproject.toml
#
# and it carries no generated header, because pip-compile's header repeats the
# interpreter version and .python-version is meant to be the only place that
# number is written. pip-tools 7.6.0 needs pip<26 to run at all; against pip
# 26.1.2 it fails importing stdlib_pkgs before it reads any argument.
#
# The stack is the one docs/decisions/0001-means.md chose: SymPy decides the
# symbolic leg, mpmath carries the arbitrary precision the numeric leg needs.
# NumPy is named in that record as a fast path only and never in the path that
# decides a verdict, so nothing depends on it yet and it is absent here rather
# than declared unused.
dependencies = [
    "sympy>=1.13",
    "mpmath>=1.3",
    "jsonschema>=4.23",
]

# No license field and no authors field. Both are open questions in #1: the
# license of the code and of the rows is entry 1, and the identity a published
# package carries is entry 7. Declaring either here would answer a question
# that is not this issue's to answer.

# The gate's own tools, locked in requirements-dev.lock the same way the runtime
# set is locked in requirements.lock. Regenerate with
#
#     pip-compile --generate-hashes --strip-extras --no-header --extra gate \
#         --output-file=requirements-dev.lock pyproject.toml
[project.optional-dependencies]
gate = [
    "ruff>=0.16",
    "mypy>=1.15",
    "toml-sort>=0.24",
    "coverage>=7.15",
    # Third-party stubs are pinned like any other dependency, which is why they
    # are here and in requirements-dev.lock rather than installed by
    # `mypy --install-types` on whichever machine happens to run the gate.
    "types-jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["src"]

# Lint and format. Both run in check mode wherever the gate calls them; neither
# has a fixing mode configured here, because a gate that rewrites the tree
# leaves a green log and a dirty working copy and the difference between those
# two is invisible afterwards.
[tool.ruff]
line-length = 88
src = ["src", "tests", "tools"]

[tool.ruff.lint]
select = [
    "A",    # shadowing a builtin
    "ARG",  # an argument nothing reads
    "B",    # bugbear
    "C4",   # comprehensions
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # import order
    "N",    # naming
    "PTH",  # os.path where pathlib is meant
    "RUF",  # ruff's own
    "SIM",  # simplifiable constructs
    "TID",  # tidy imports
    "UP",   # constructs the floor makes obsolete
    "W",    # pycodestyle warnings
]

# Types. strict, and over a module set written out rather than discovered, so a
# module joins the checked set by being added to this list. Nothing infers it,
# which is the point: tests/test_type_check_coverage.py refuses a tracked module
# that is missing from it, so the list cannot fall behind the tree in silence.
[tool.mypy]
strict = true
files = [
    "src/findbuch/__init__.py",
    "tests/test_package_tree.py",
    "tests/test_gate.py",
    "tests/test_row_schema.py",
    "tests/test_type_check_coverage.py",
    "src/findbuch/validation.py",
    "src/findbuch/invariants.py",
    "tests/test_invariants.py",
    "tools/check_invariants.py",
    "tools/check_catalogue_format.py",
    "tools/check_catalogue_schema.py",
    "tools/check_interpreter.py",
    "tools/gate.py",
    "tools/floor.py",
    "tests/test_floor.py",
    "tools/coverage_bar.py",
    "tests/test_coverage_bar.py",
]

# Coverage. Branch coverage, over what this project ships and not over the suite
# that exercises it: a number that counted the tests would rise when a test was
# added and say nothing about the code. Which modules are gated on the number and
# which are only reported is tools/coverage_bar.py, with the reason at each one,
# and #54 is where that split was argued.
[tool.coverage.run]
branch = true
source = ["src", "tools"]

[tool.coverage.report]
show_missing = true

# Row formatting. --no-sort-tables, because the field order in a row is fixed by
# docs/decisions/0003-row-format.md and reordering it would make two rows harder
# to compare rather than easier, which is the whole reason the rows are formatted
# at all.
[tool.tomlsort]
no_sort_tables = true
spaces_indent_inline_array = 4
trailing_comma_inline_array = true
