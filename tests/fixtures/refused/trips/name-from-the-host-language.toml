# A file the loader must refuse, and beside it the file one change away that
# it must accept. The pair is what makes this entry evidence: without the
# neighbour, a validator that refused everything would pass.
# tests/test_refused_corpus.py names the refusal identifier this file earns.
#
# The attack: __builtins__, a name with a meaning in the language this is
# written in and no meaning in a row. It earns the same refusal a mistyped
# parameter earns, and that is the point worth having a file for: nothing
# here looks a name up, so there is no list of dangerous names to keep in
# step with anything. A name is in the table or it is not.
id = "name-from-the-host-language"
name = "A name that resolves in the host language and not in the row"
status = "active"
revision = 1
structure = "e3"
hamiltonian = "(M1*M1 + M2*M2 + M3*M3)/(2*__builtins__)"
integrals = ["M1*g1 + M2*g2 + M3*g3"]
validity = "general"

[[parameters]]
symbol = "A1"
meaning = "the moment of inertia of a spherically symmetric body"

[domain]
description = "the whole phase space, for a positive moment"
parameter_space = ["A1 > 0"]

[[provenance]]
reference = "fixture reference, not a real citation"
language = "de"
location = "fixture location"
notation = "fixture notation"
role = "original"
read = "directly"
