# A file the loader must refuse, and beside it the file one change away that
# it must accept. The pair is what makes this entry evidence: without the
# neighbour, a validator that refused everything would pass.
# tests/test_refused_corpus.py names the refusal identifier this file earns.
#
# The mistake: the row declares A1 and the Hamiltonian says A11. This is
# the one the whole symbol table exists for. Nothing about the file looks
# wrong, the parameter list is not empty so the crude parameter rule
# passes it, and without the table A11 becomes a free variable that makes
# a bracket vanish for a reason that has nothing to do with the case.
id = "parameter-misspelled-by-one-letter"
name = "A parameter misspelled by one letter"
status = "active"
revision = 1
structure = "e3"
hamiltonian = "(M1*M1 + M2*M2 + M3*M3)/(2*A11)"
integrals = ["M1*g1 + M2*g2 + M3*g3"]
validity = "general"

[[parameters]]
symbol = "A1"
meaning = "the moment of inertia of a spherically symmetric body"

[domain]
description = "the whole phase space, for a positive moment"
parameter_space = ["A1 > 0"]

[[provenance]]
reference = "fixture reference, not a real citation"
language = "de"
location = "fixture location"
notation = "fixture notation"
role = "original"
read = "directly"
