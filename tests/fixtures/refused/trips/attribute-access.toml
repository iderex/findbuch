# A file the loader must refuse, and beside it the file one change away that
# it must accept. The pair is what makes this entry evidence: without the
# neighbour, a validator that refused everything would pass.
# tests/test_refused_corpus.py names the refusal identifier this file earns.
#
# The attack: A1.numerator. Attribute access is how a formula stops being
# a formula and becomes a way into the interpreter, and 0004 says the
# grammar is the boundary and there is no sandbox behind it. It is refused
# at the attribute, with nothing looked up first.
id = "attribute-access"
name = "An attribute reached out of a declared symbol"
status = "active"
revision = 1
structure = "e3"
hamiltonian = "(M1*M1 + M2*M2 + M3*M3)/(2*A1.numerator)"
integrals = ["M1*g1 + M2*g2 + M3*g3"]
validity = "general"

[[parameters]]
symbol = "A1"
meaning = "the moment of inertia of a spherically symmetric body"

[domain]
description = "the whole phase space, for a positive moment"
parameter_space = ["A1 > 0"]

[[provenance]]
