# A file the loader must refuse, and beside it the file one change away that
# it must accept. The pair is what makes this entry evidence: without the
# neighbour, a validator that refused everything would pass.
# tests/test_refused_corpus.py names the refusal identifier this file earns.
#
# The attack: twenty characters that denote more terms than anything will
# hold. The grammar admits it, the depth is four, and no reading of the
# string is expensive; what is expensive is what a checker downstream does
# with it. So it is bounded by the number of terms it expands to, counted
# structurally and without expanding anything.
