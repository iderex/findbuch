# A file the loader must refuse, and beside it the file one change away that
# it must accept. The pair is what makes this entry evidence: without the
# neighbour, a validator that refused everything would pass.
# tests/test_refused_corpus.py names the refusal identifier this file earns.
#
# The mistake: validity is conditional and no constraint is written down.
# The claim is that the case is integrable under a condition, the
# condition is missing, and what would be checked is the empty ideal,
# which is the general question wearing another name.
#
# This is the one entry in the corpus refused by the row rules rather
# than by the grammar.
