meaning = "principal moment of inertia about the second axis"

[[parameters]]
symbol = "A3"
meaning = "principal moment of inertia about the third axis"

[domain]
description = "the whole phase space, for positive principal moments"
parameter_space = ["A1 > 0", "A2 > 0", "A3 > 0"]

